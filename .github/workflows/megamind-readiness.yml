name: Megamind Readiness

on:
  pull_request:
  push:
    branches:
      - main
      - feat/megamind-execution-body

permissions:
  contents: read

jobs:
  structural-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run zero-secret Megamind health check
        run: node scripts/megamind-healthcheck.mjs
